name: MLP Automation Run
run-name: "MLP Run ${{ inputs.requestId }}"

# Aligns with form-server.js MODES.mlp:
#   - Fixture path:  cypress/fixtures/mlp/mlpTestData.json
#   - Specs run:     mlpLeadForm + downloadBrochure + downloadSyllabus (3 specs)
#   - Test count:    9 (7 lead-form edge cases + 1 brochure + 1 syllabus)
#   - Pixel:         enabled (MLP is the only mode that captures pixels)

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      platform:
        description: "test or main"
        required: true
        default: "test"
        type: choice
        options: [test, main]
      name:
        description: "Lead name"
        required: true
        type: string
      baseEmail:
        description: "Base email"
        required: true
        type: string
      basePhone:
        description: "Base phone"
        required: true
        type: string
      differentEmail:
        description: "Different email"
        required: true
        type: string
      differentPhone:
        description: "Different phone"
        required: true
        type: string
      requestId:
        description: "Request correlation id from UI"
        required: true
        type: string

jobs:
  run-mlp:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules and Cypress binary
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-modules-
          save-always: true

      - name: Install deps
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build MLP fixture from inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        # Project moved MLP fixtures into a per-page subdirectory. mkdir -p
        # guards against the directory not existing on a fresh checkout.
        run: |
          mkdir -p cypress/fixtures/mlp
          cat > cypress/fixtures/mlp/mlpTestData.json <<'EOF'
          {
            "name": "${{ github.event.inputs.name }}",
            "existingEmail": "${{ github.event.inputs.baseEmail }}",
            "existingPhone": "${{ github.event.inputs.basePhone }}",
            "newEmail": "${{ github.event.inputs.baseEmail }}",
            "newPhone": "${{ github.event.inputs.basePhone }}",
            "sameEmailDifferentPhone": {
              "email": "${{ github.event.inputs.baseEmail }}",
              "phone": "${{ github.event.inputs.differentPhone }}"
            },
            "samePhoneDifferentEmail": {
              "email": "${{ github.event.inputs.differentEmail }}",
              "phone": "${{ github.event.inputs.basePhone }}"
            },
            "extraValidEmails": [],
            "extraValidPhones": [],
            "invalidEmails": ["plainaddress", "missingatsign.com", "missing-domain@", "user@domain", "user@.com"],
            "invalidPhones": ["", "12345", "abcdefghij", "9999999999999", "123-456-7890"],
            "otp": "159753"
          }
          EOF

      - name: Select base URL
        if: github.event_name == 'workflow_dispatch'
        id: platform
        shell: bash
        run: |
          if [ "${{ github.event.inputs.platform }}" = "main" ]; then
            echo "baseUrl=https://program.kraftshala.com/" >> $GITHUB_OUTPUT
          else
            echo "baseUrl=https://testprogram.kraftshala.com/" >> $GITHUB_OUTPUT
          fi

      - name: Run Cypress (MLP — lead form + brochure + syllabus)
        if: github.event_name == 'workflow_dispatch'
        # Runs all 3 MLP specs in sequence — same bundle form-server.js dispatches
        # locally for the "Run MLP tests" button. Comma-separated --spec arg is
        # the Cypress idiom for multi-spec runs.
        run: |
          npx cypress run \
            --spec "cypress/e2e/mlp/mlpLeadForm.cy.js,cypress/e2e/mlp/downloadBrochure.cy.js,cypress/e2e/mlp/downloadSyllabus.cy.js" \
            --config baseUrl=${{ steps.platform.outputs.baseUrl }} \
            --env platform=${{ github.event.inputs.platform }}

      - name: Upload Cypress artifacts (screenshots, videos, reports)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ github.event.inputs.requestId }}
          path: |
            cypress/screenshots
            cypress/videos
            cypress/reports
          if-no-files-found: ignore
          retention-days: 7
