services:
  - type: web
    name: mlp-automation
    runtime: docker
    plan: starter
    autoDeploy: true

    # Render will build using your Dockerfile at repo root
    dockerfilePath: ./Dockerfile

    # Your app serves the form UI on this port
    envVars:
      - key: MLP_FORM_PORT
        value: "4000"
      - key: MLP_CYPRESS_CMD
        value: "cypress"
      - key: CI
        value: "true"

      # ── Optional: override lead-delete API endpoints ──────────────────
      # MLP (test + main)
      # - key: MLP_EMAIL_DELETE_BASE_TEST
      #   value: "https://testservice.kraftshala.com/lead/remove-lead/mlp/"
      # - key: MLP_PHONE_DELETE_BASE_TEST
      #   value: "https://testservice.kraftshala.com/otp-validation/removeNumber/"
      # - key: MLP_EMAIL_DELETE_BASE_MAIN
      #   value: "https://service.kraftshala.com/lead/remove-lead/mlp/"
      # - key: MLP_PHONE_DELETE_BASE_MAIN
      #   value: "https://service.kraftshala.com/otp-validation/removeNumber/"
      #
      # ALM — phone delete shared with MLP (otp-validation is page-agnostic)
      # - key: ALM_EMAIL_DELETE_BASE_TEST
      #   value: "https://testservice.kraftshala.com/lead/remove-lead/pgp/"
      # - key: ALM_EMAIL_DELETE_BASE_MAIN
      #   value: "https://service.kraftshala.com/lead/remove-lead/pgp/"
      #
      # SMBL — also on the PGP service path (same as ALM by default)
      # - key: SMBL_EMAIL_DELETE_BASE_TEST
      #   value: "https://testservice.kraftshala.com/lead/remove-lead/pgp/"
      # - key: SMBL_EMAIL_DELETE_BASE_MAIN
      #   value: "https://service.kraftshala.com/lead/remove-lead/pgp/"

      # ── Optional: GitHub Actions remote-run trigger ─────────────────
      # When all four are set, the dashboard's Run buttons dispatch the
      # mode-matching workflow in .github/workflows/ instead of running
      # Cypress locally on the Render container. Useful when Render's
      # starter plan doesn't have enough RAM/CPU to run Cypress reliably.
      # - key: GITHUB_OWNER
      #   value: "your-github-org-or-user"
      # - key: GITHUB_REPO
      #   value: "MLP-Automation"
      # - key: GITHUB_REF
      #   value: "main"
      # - key: GITHUB_WORKFLOW_FILE
      #   value: "mlp-run.yml"   # default; form-server still hardcodes this
      # - key: GITHUB_TOKEN
      #   sync: false             # set this in Render dashboard as a secret
