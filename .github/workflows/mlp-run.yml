name: MLP Automation Run
run-name: "MLP Run ${{ inputs.requestId }}"

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      platform:
        description: "test or main"
        required: true
        default: "test"
        type: choice
        options: [test, main]
      name:
        description: "Lead name"
        required: true
        type: string
      baseEmail:
        description: "Base email"
        required: true
        type: string
      basePhone:
        description: "Base phone"
        required: true
        type: string
      differentEmail:
        description: "Different email"
        required: true
        type: string
      differentPhone:
        description: "Different phone"
        required: true
        type: string
      requestId:
        description: "Request correlation id from UI"
        required: true
        type: string

jobs:
  run-mlp:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install deps
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build fixture from inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cat > cypress/fixtures/mlpTestData.json <<'EOF'
          {
            "name": "${{ github.event.inputs.name }}",
            "existingEmail": "${{ github.event.inputs.baseEmail }}",
            "existingPhone": "${{ github.event.inputs.basePhone }}",
            "newEmail": "${{ github.event.inputs.baseEmail }}",
            "newPhone": "${{ github.event.inputs.basePhone }}",
            "sameEmailDifferentPhone": {
              "email": "${{ github.event.inputs.baseEmail }}",
              "phone": "${{ github.event.inputs.differentPhone }}"
            },
            "samePhoneDifferentEmail": {
              "email": "${{ github.event.inputs.differentEmail }}",
              "phone": "${{ github.event.inputs.basePhone }}"
            },
            "extraValidEmails": [],
            "extraValidPhones": [],
            "invalidEmails": ["plainaddress", "missingatsign.com", "missing-domain@", "user@domain", "user@.com"],
            "invalidPhones": ["", "12345", "abcdefghij", "9999999999999", "123-456-7890"],
            "otp": "159753"
          }
          EOF

      - name: Select base URL
        if: github.event_name == 'workflow_dispatch'
        id: platform
        shell: bash
        run: |
          if [ "${{ github.event.inputs.platform }}" = "main" ]; then
            echo "baseUrl=https://program.kraftshala.com/" >> $GITHUB_OUTPUT
          else
            echo "baseUrl=https://testprogram.kraftshala.com/" >> $GITHUB_OUTPUT
          fi

      - name: Run Cypress
        if: github.event_name == 'workflow_dispatch'
        run: npx cypress run --spec cypress/e2e/mlpLeadForm.cy.js --config baseUrl=${{ steps.platform.outputs.baseUrl }}
