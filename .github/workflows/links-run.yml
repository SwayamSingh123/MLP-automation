name: Broken Link Checker Run
run-name: "Links Run ${{ inputs.requestId }}"

# Aligns with form-server.js MODES.links:
#   - Specs run:     brokenLinkChecker (1 spec, 1 test per page)
#   - Fixture:       none
#   - Pixel:         disabled
#   - Lead-delete:   none
#   - Results:       cypress/reports/broken-links-results.json (uploaded as artifact)
#
# Inputs:
#   platform — "test" or "main"
#   pages    — comma-separated page IDs to crawl (empty = all 13)
#   requestId — UI correlation id

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "test or main"
        required: true
        default: "test"
        type: choice
        options: [test, main]
      pages:
        description: "Comma-separated page IDs to crawl (leave empty for all pages)"
        required: false
        default: ""
        type: string
      requestId:
        description: "Request correlation id from UI"
        required: true
        type: string

jobs:
  run-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules and Cypress binary
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-modules-
          save-always: true

      - name: Install deps
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Select base URL
        id: platform
        shell: bash
        run: |
          if [ "${{ github.event.inputs.platform }}" = "main" ]; then
            echo "baseUrl=https://program.kraftshala.com/" >> $GITHUB_OUTPUT
          else
            echo "baseUrl=https://testprogram.kraftshala.com/" >> $GITHUB_OUTPUT
          fi

      - name: Write Links selected-pages config
        shell: bash
        run: |
          # Form-server normally writes this file before launching Cypress.
          # Here we mirror that for the GitHub Actions path. cypress.config.js
          # picks it up in setupNodeEvents and exposes the list via
          # Cypress.env('linksPages') — no shell escaping headaches.
          mkdir -p cypress/reports
          node -e "
            const fs = require('fs');
            const input = process.env.PAGES_INPUT || '';
            const pages = input.split(',').map(s => s.trim()).filter(Boolean);
            fs.writeFileSync('cypress/reports/links-selected-pages.json', JSON.stringify({ pages }, null, 2));
            console.log('[links] selected pages:', pages.length ? pages.join(',') : '(all)');
          "
        env:
          PAGES_INPUT: ${{ github.event.inputs.pages }}

      - name: Run Cypress (Broken Link Checker)
        run: |
          npx cypress run \
            --spec "cypress/e2e/links/brokenLinkChecker.cy.js" \
            --config baseUrl=${{ steps.platform.outputs.baseUrl }} \
            --env platform=${{ github.event.inputs.platform }},disablePixel=true

      - name: Upload Cypress artifacts (screenshots, videos, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-artifacts-${{ github.event.inputs.requestId }}
          path: |
            cypress/screenshots
            cypress/videos
            cypress/reports
          if-no-files-found: ignore
          retention-days: 7
