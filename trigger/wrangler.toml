name = "kraftshala-qa-trigger"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
GITHUB_OWNER = "SwayamSingh123"
GITHUB_REPO = "MLP-automation"
WORKFLOW_FILE = "qa-report.yml"
